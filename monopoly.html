<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>大富翁 NFC 记账</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0e6d3; /* 仿棋盘底色 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            padding: 28px 24px;
        }
        h1 {
            font-size: 26px;
            text-align: center;
            color: #b8860b;
            margin-bottom: 18px;
            letter-spacing: 2px;
        }
        .players {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }
        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
            border-radius: 14px;
            padding: 14px 18px;
            border-left: 6px solid;
            transition: all 0.2s;
        }
        .player-name {
            font-weight: 700;
            font-size: 18px;
        }
        .player-balance {
            font-size: 24px;
            font-weight: 800;
            color: #333;
        }
        .player-balance.positive { color: #2e7d32; }
        .player-balance.negative { color: #c62828; }
        .color-A { border-left-color: #e53935; }   /* 红 */
        .color-B { border-left-color: #1e88e5; }   /* 蓝 */
        .color-C { border-left-color: #43a047; }   /* 绿 */

        .log-area {
            background: #f5f0eb;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            min-height: 48px;
            display: flex;
            align-items: center;
            font-size: 15px;
            color: #555;
        }
        .log-text { flex: 1; }
        .reset-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 40px;
            background: #b8860b;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .reset-btn:active { background: #9a7209; }

        .tip {
            margin-top: 14px;
            font-size: 13px;
            color: #888;
            text-align: center;
        }
        .tip a { color: #b8860b; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏦 大富翁账本</h1>

    <!-- 三个玩家卡片 -->
    <div class="players">
        <div class="player-card color-A">
            <span class="player-name">👑 玩家 A</span>
            <span id="balance-A" class="player-balance positive">0</span>
        </div>
        <div class="player-card color-B">
            <span class="player-name">💎 玩家 B</span>
            <span id="balance-B" class="player-balance positive">0</span>
        </div>
        <div class="player-card color-C">
            <span class="player-name">🍀 玩家 C</span>
            <span id="balance-C" class="player-balance positive">0</span>
        </div>
    </div>

    <!-- 日志区域 -->
    <div class="log-area">
        <span id="log-message" class="log-text">等待触碰 NFC 标签…</span>
    </div>

    <!-- 重置按钮 -->
    <button class="reset-btn" onclick="resetAll()">🔄 重置所有余额</button>
M：數字點後6個零/位<br>
1M=1,000,000;  1.5M=1500000<br>
K：3個零/位<br>
1K=1,000;  1.5K=1500<br>
    <div class="tip">
        💡 用 NFC 贴纸写入 URL 即可自动记账<br>

        示例：<code>...?player=A&amp;delta=200</code> 或 <code>...?player=B&amp;delta=-100</code>
    </div>
</div>

<script>
// ---------- 核心逻辑 ----------

// 玩家列表
const PLAYERS = ['A', 'B', 'C'];

// 从 localStorage 读取余额，没有则初始化为 0
function loadBalances() {
    const data = localStorage.getItem('monopoly_balances');
    if (data) {
        try {
            return JSON.parse(data);
        } catch(e) {}
    }
    // 默认全部 0
    const defaultBal = {};
    PLAYERS.forEach(p => defaultBal[p] = 0);
    return defaultBal;
}

// 保存余额到 localStorage
function saveBalances(balances) {
    localStorage.setItem('monopoly_balances', JSON.stringify(balances));
}

// 更新页面显示
function updateUI(balances, logMsg) {
    PLAYERS.forEach(p => {
        const el = document.getElementById(`balance-${p}`);
        const val = balances[p];
        el.textContent = val;
        // 正负颜色
        el.className = 'player-balance' + (val >= 0 ? ' positive' : ' negative');
    });
    if (logMsg) {
        document.getElementById('log-message').textContent = logMsg;
    }
}

// 处理一笔交易
function processTransaction(player, delta) {
    const balances = loadBalances();
    if (!PLAYERS.includes(player)) {
        updateUI(balances, `❌ 未知玩家 "${player}"`);
        return;
    }
    const oldVal = balances[player];
    const newVal = oldVal + delta;
    balances[player] = newVal;
    saveBalances(balances);

    const sign = delta >= 0 ? '+' : '';
    const msg = `✅ 玩家 ${player}：${oldVal} → ${newVal} (${sign}${delta})`;
    updateUI(balances, msg);
}

// 重置所有余额为 0
function resetAll() {
    const balances = {};
    PLAYERS.forEach(p => balances[p] = 0);
    saveBalances(balances);
    updateUI(balances, '🔄 所有余额已归零');
}

// ---------- 解析 URL 参数 ----------
function parseQueryParams() {
    const params = new URLSearchParams(window.location.search);
    const player = params.get('player');
    const deltaStr = params.get('delta');
    if (player && deltaStr !== null) {
        const delta = parseInt(deltaStr, 10);
        if (!isNaN(delta)) {
            processTransaction(player.toUpperCase(), delta);
        } else {
            // 无效数值
            const balances = loadBalances();
            updateUI(balances, `⚠️ 无效金额: "${deltaStr}"`);
        }
        // 清除 URL 参数，避免刷新时重复处理
        window.history.replaceState({}, '', window.location.pathname);
    } else {
        // 正常加载，显示当前余额
        const balances = loadBalances();
        updateUI(balances, '📋 当前余额如上');
    }
}

// 页面加载完成后执行
window.addEventListener('DOMContentLoaded', parseQueryParams);
</script>
</body>
</html>
