<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAS WebRTC 傳輸測試</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
        #log { border: 1px solid #ccc; height: 150px; overflow-y: scroll; text-align: left; padding: 10px; background: #f9f9f9; }
    </style>
</head>
<body>

    <h2>GAS WebRTC P2P 傳輸</h2>
    <p>房間 ID: <strong id="roomDisplay">123456</strong></p>
    
    <button onclick="startAsA()">手機 A (發起端)</button>
    <button onclick="startAsB()">手機 B (接收端)</button>
    
    <hr>
    <input type="text" id="msgInput" placeholder="輸入要傳送的文字" disabled>
    <button id="sendBtn" onclick="sendMessage()" disabled>傳送</button>
    
    <h3>日誌紀錄：</h3>
    <div id="log"></div>

<script>
// ⚠️ 請替換成你自己的 Google Apps Script 部署網址
const GAS_URL = "https://script.google.com/macros/s/AKfycbyVNy-fWZV7g0k7RYXKtxKEHYZj5csvaV2o1ElOWkRJ1c0fr_rDWBqUWXsjfY4cafvW/exec"; 
const ROOM_ID = "234567"; // 測試方便固定，實務上可隨機生成並做成二維碼

let pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:://google.com' }] });
let dataChannel;

function log(msg) {
    const div = document.getElementById('log');
    div.innerHTML += msg + '<br>';
    div.scrollTop = div.scrollHeight;
}

// 監聽連線通道狀態
function setupDataChannelHooks(channel) {
    channel.onopen = () => {
        log("✅ 數據通道已開啟！兩機已成功連接。");
        document.getElementById('msgInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
    };
    channel.onmessage = (e) => log("📩 收到對方資料: " + e.data);
}

// ================= 手機 A 的操作流程 =================
async function startAsA() {
    log("🚀 手機 A：正在建立 Offer...");
    dataChannel = pc.createDataChannel("chat");
    setupDataChannelHooks(dataChannel);

    // 收集網路節點資訊 (ICE)
    pc.onicecandidate = async (e) => {
        if (!e.candidate) { // 當 ICE 收集完畢時
            log("📡 手機 A：上傳 Offer 到 GAS...");
            await fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors", // 跨網域寫入
                body: JSON.stringify({ roomId: ROOM_ID, type: "offer", data: JSON.stringify(pc.localDescription) })
            });
            log("⏳ 等待手機 B 回應 (每3秒輪詢一次)...");
            pollForAnswer();
        }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
}

// 手機 A 輪詢等待 B 的回應
function pollForAnswer() {
    const timer = setInterval(async () => {
        let res = await fetch(`${GAS_URL}?roomId=${ROOM_ID}&type=answer`);
        let json = await res.json();
        if (json.data) {
            clearInterval(timer);
            log("🔗 手機 A：收到 B 的 Answer，建立 P2P 連線中...");
            await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(json.data)));
        }
    }, 3000);
}

// ================= 手機 B 的操作流程 =================
async function startAsB() {
    log("🚀 手機 B：嘗試從 GAS 獲取手機 A 的 Offer...");
    let res = await fetch(`${GAS_URL}?roomId=${ROOM_ID}&type=offer`);
    let json = await res.json();
    
    if (!json.data) {
        log("❌ 找不到手機 A 的 Offer，請確認 A 是否已先點擊！");
        return;
    }

    pc.ondatachannel = (e) => {
        dataChannel = e.channel;
        setupDataChannelHooks(dataChannel);
    };

    await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(json.data)));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    pc.onicecandidate = async (e) => {
        if (!e.candidate) {
            log("📡 手機 B：上傳 Answer 到 GAS...");
            await fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ roomId: ROOM_ID, type: "answer", data: JSON.stringify(pc.localDescription) })
            });
            log("⌛ 手機 B：Answer 已送出，等待連線建立...");
        }
    };
}

// ================= 傳送訊息 =================
function sendMessage() {
    const msg = document.getElementById('msgInput').value;
    if (dataChannel && msg) {
        dataChannel.send(msg);
        log("📤 我方送出: " + msg);
        document.getElementById('msgInput').value = "";
    }
}
</script>
</body>
</html>
