<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大富翁財富計算工具</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .text-display { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #333; }  

     <!--   input[type="text"] { width: 100%; margin-bottom: 20px; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; } -->
       
        /* 🎯 關鍵修正：將 type="number" 徹底改為 type="text"，確保 100% 寬度與間距生效 */
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            font-size: 16px; 
            margin-bottom: 25px; /* 🛠️ 已加大間距，徹底推開下方的數字按鈕 */
            border: 1px solid #ccc; 
            border-radius: 5px; 
            box-sizing: border-box; 
        }
        
        button { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn-refresh { background-color: #4CAF50; color: white; }
        .btn-unit { background-color: #2196F3; color: white; display: inline-block; width: 48%; }
        .btn-action { background-color: #FF9800; color: white; }
        .btn-danger { background-color: #f44336; color: white; }
        .unit-container { display: flex; justify-content: space-between; }

        /* 🎯 專屬修改：只針對用戶資產值這一行放大並改為橘底白字 */
        #p1-text {
            padding: 20px 40px;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ffd700, #ffa500);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-bottom: 18px; 
        }

        /* 🆕 新增：數字鍵盤區域樣式 */
        .num-pad-row { display: flex; justify-content: space-between; gap: 5px; margin-bottom: 10px; }
        .btn-num { background-color: #e0e0e0; color: #333; margin-bottom: 0; flex: 1; padding: 10px 0; font-size: 18px; }
        .btn-num:active { background-color: #bdbdbd; }
        .btn-clear { background-color: #9e9e9e; color: white; } /* 清除鍵額外明顯 */

        /* 玩家切換選單樣式 */
        .player-selector { margin-bottom: 15px; padding: 5px; font-size: 14px; width: 100%; }

        /* 彈出視窗樣式 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-close { background-color: #008CBA; color: white; width: auto; padding: 10px 20px; margin-bottom: 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- 快捷切換身份選單 -->
    <select class="player-selector" id="player-select" onchange="switchPlayer(this.value)">
        <option value="1">玩家 1：燈龍魚</option>
        <option value="2">玩家 2：小毛蟲</option>
        <option value="3">玩家 3：BB軒</option>
        <option value="4">玩家 4：玩家4</option>
    </select>

    <!-- (文字1) 資產顯示 -->
    <div class="gold-txt" id="p1-text">玩家資產：統計中...</div>

    <!-- (按鈕8) 現金池按鈕 -->
    <button class="btn-refresh" id="btn-pool" onclick="handleAction('click_pool')">現金池現金：統計中...</button>
    
    <!-- (輸入框1) 金額輸入 -->
    <input type="text" id="amount-input" placeholder="請輸入金額">
    
    <!-- 🆕 數字按鈕（共兩行，平均大小） -->
    <div class="num-pad-row">
        <button class="btn-num" onclick="appendNum('1')">1</button>
        <button class="btn-num" onclick="appendNum('2')">2</button>
        <button class="btn-num" onclick="appendNum('3')">3</button>
        <button class="btn-num" onclick="appendNum('4')">4</button>
        <button class="btn-num" onclick="appendNum('5')">5</button>
    </div>
    <div class="num-pad-row">
        <button class="btn-num" onclick="appendNum('6')">6</button>
        <button class="btn-num" onclick="appendNum('7')">7</button>
        <button class="btn-num" onclick="appendNum('8')">8</button>
        <button class="btn-num" onclick="appendNum('9')">9</button>
        <button class="btn-num" onclick="appendNum('0')">0</button>
        <button class="btn-num btn-dot" onclick="appendNum('.')">.</button>

        <button class="btn-num btn-clear" onclick="clearInput()">C</button> <!-- 追加清除鍵，維持兩行天平排版 -->
    </div>
    
    <!-- 單位轉換按鈕 -->
    <div class="unit-container">
        <!-- (按鈕1) K單位 -->
        <button class="btn-unit" onclick="convertUnit(1000)">K(千)</button>
        <!-- (按鈕2) M單位 -->
        <button class="btn-unit" onclick="convertUnit(1000000)">M(百萬)</button>
    </div>
    
    <!-- 遊戲功能按鈕 -->
    <!-- (按鈕0) 付租金 -->
    <button class="btn-danger" onclick="handleAction('pay_rent')">付租金 (➖入現金池)</button>
    <!-- (按鈕9) 罸款/買地 -->
    <button class="btn-danger" onclick="handleAction('fine_or_buy')">罸款/買地 (純扣錢)</button>
</div>

<!-- 彈出視窗 (按鈕5) -->
<div class="modal" id="success-modal">
    <div class="modal-content">
        <p style="font-size: 18px; font-weight: bold; margin-bottom: 15px;">操作狀態</p>
        <button class="btn-close" id="btn-modal-5" onclick="closeModal()">領取成功</button>
    </div>
</div>

<script>
   const API_URL = "https://script.google.com/macros/s/AKfycbzpIw0JWWqZ2nPxPouxwvk3oWjM5A9iM-LpF1FLPB5TlaqZT2To6TzJNxPzkiZ9kAfUxw/exec"; 

    const p1Text = document.getElementById('p1-text');
    const btnPool = document.getElementById('btn-pool');
    const amountInput = document.getElementById('amount-input');
    const modal = document.getElementById('success-modal');
    const playerSelect = document.getElementById('player-select');

    const urlParams = new URLSearchParams(window.location.search);
    let currentPlayer = urlParams.get('p') || "1";
    
    playerSelect.value = currentPlayer;

    // ==========================================
    // 🎯 🆕 新增：NFC 晶片特定內容探測與自動處理邏輯
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
        const action = urlParams.get('action');
        const player = urlParams.get('player');
        const amount = urlParams.get('amount');

        // 當偵測到網址符合大富翁加碼規則時
        if (action === 'prep_pool' && player === '現金池' && amount) {
            // 建立無感透明度覆蓋畫面，告知玩家系統正在執行加碼
            const overlay = document.createElement('div');
            overlay.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:#eafeec; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; font-family:Arial,sans-serif;";
            overlay.innerHTML = `
                <div style="background:white; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); text-align:center; max-width:85%;">
                    <h1 style="color:#2ecc71; margin:0 0 10px 0; font-size:24px;">💰 金額同步中...</h1>
                    <p style="color:#333; margin:5px 0; font-size:16px;">正在往現金池匯入 <strong>$${Number(amount).toLocaleString()}</strong></p>
                    <div style="font-size:13px; color:#7f8c8d; margin-top:15px;" id="nfc-status-text">連線至試算表資料庫...</div>
                </div>
            `;
            document.body.appendChild(overlay);

            // 將請求動態發送至您的 GAS 
            const gasNfcUrl = `${API_URL}?player=現金池&amount=${amount}`;

            fetch(gasNfcUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success" || data.message === "現金池加碼成功") {
                        document.getElementById('nfc-status-text').innerText = "✅ 加碼成功！網頁即將關閉...";
                        document.getElementById('nfc-status-text').style.color = "#27ae60";
                        
                        // 1秒後執行完美自動關閉分頁
                        setTimeout(() => {
                            window.close();
                            // 🚀 雙重防護安全線：如果手機瀏覽器安全設定不允許關閉獨立分頁，則在一瞬間自動跳轉回無參數的大富翁記帳首頁
                            setTimeout(() => {
                                window.location.href = window.location.pathname; 
                            }, 200);
                        }, 1000);
                    } else {
                        document.getElementById('nfc-status-text').innerText = "⚠️ 試算表回應異常，頁面即將跳轉...";
                        setTimeout(() => { window.location.href = window.location.pathname; }, 1500);
                    }
                })
                .catch(err => {
                    document.getElementById('nfc-status-text').innerText = "❌ 同步失敗，改為載入正常面板";
                    document.getElementById('nfc-status-text').style.color = "#c0392b";
                    console.error("NFC加碼失敗:", err);
                    // 失敗時，2秒後移除遮罩正常顯示主面板，不干擾遊戲進行
                    setTimeout(() => { overlay.remove(); fetchFromSheet(); }, 2000);
                });
        } else {
            // 若為一般開啟，則正常初始化面板資料
            fetchFromSheet();
        }
    });

    function switchPlayer(playerVal) {
        window.location.search = `?p=${playerVal}`;
    }

    async function fetchFromSheet() {
        try {
            const response = await fetch(`${API_URL}?p=${currentPlayer}`);
            const data = await response.json();
            
            p1Text.innerText = `${data.p_name}💰： ${data.p_cash} (${Number(data.p_cash) / 1000000}M)`;
            btnPool.innerText = `現金池現金：${data.pool_cash}`;
        } catch (error) {
            console.error("讀取試算表失敗:", error);
        }
    }

    // 🎯 重新設計的防失敗疊加邏輯
    function appendNum(clickedValue) {
        // 1. 讀取輸入金額框原數值
        let currentText = amountInput.value ? amountInput.value.toString() : "";
