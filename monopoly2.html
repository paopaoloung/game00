<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大富翁財富計算工具</title>
    <style>
        /* 網頁基礎樣式（維持原本大小） */
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .text-display { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #333; }
        input[type="number"] { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn-refresh { background-color: #4CAF50; color: white; }
        .btn-unit { background-color: #2196F3; color: white; display: inline-block; width: 48%; }
        .btn-action { background-color: #FF9800; color: white; }
        .btn-danger { background-color: #f44336; color: white; }
        .unit-container { display: flex; justify-content: space-between; }
        .player-selector { margin-bottom: 15px; padding: 5px; font-size: 14px; width: 100%; }

        /* 專屬樣式：用戶資產值放大、橘底白字 */
        #p1-text {
            font-size: 26px;          
            font-weight: 900;         
            color: #ffffff;            
            background-color: #FF9800; 
            padding: 12px;             
            border-radius: 6px;        
            text-align: center;        
            margin-bottom: 20px;       
        }

        /* 彈出視窗樣式 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-close { background-color: #008CBA; color: white; width: auto; padding: 10px 20px; margin-bottom: 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- 快捷切換身份選單 -->
    <select class="player-selector" id="player-select" onchange="switchPlayer(this.value)">
        <option value="1">玩家 1：燈龍魚</option>
        <option value="2">玩家 2：小毛蟲</option>
        <option value="3">玩家 3：BB軒</option>
        <option value="4">玩家 4：玩家4</option>
    </select>

    <!-- (文字1) 資產顯示（已轉換為 M 單位顯示） -->
    <div id="p1-text">載入中...$： 載入中...</div>
    
    <!-- (按鈕8) 現金池按鈕 -->
    <button class="btn-refresh" id="btn-pool" onclick="handleAction('click_pool')">現金池現金：載入中...</button>
    
    <!-- (輸入框1) 金額輸入 -->
    <input type="number" id="amount-input" placeholder="請輸入金額">
    
    <!-- 單位轉換按鈕 -->
    <div class="unit-container">
        <!-- (按鈕1) K單位 -->
        <button class="btn-unit" onclick="convertUnit(1000)">K單位</button>
        <!-- (按鈕2) M單位 -->
        <button class="btn-unit" onclick="convertUnit(1000000)">M單位</button>
    </div>
    
    <!-- 遊戲功能按鈕 -->
    <!-- (按鈕3) 到終點奬金2M -->
    <button class="btn-action" onclick="handleAction('end_prize')">到終點奬金2M</button>
    <!-- (按鈕0) 付租金 -->
    <button class="btn-danger" onclick="handleAction('pay_rent')">付租金</button>
    <!-- (按鈕9) 罸款/買地 -->
    <button class="btn-danger" onclick="handleAction('fine_or_buy')">罸款/買地</button>
</div>

<!-- 彈出視窗 (按鈕5) -->
<div class="modal" id="success-modal">
    <div class="modal-content">
        <p style="font-size: 18px; font-weight: bold; margin-bottom: 15px;">操作狀態</p>
        <button class="btn-close" id="btn-modal-5" onclick="closeModal()">領取成功</button>
    </div>
</div>

<script>
    // ⚠️ 記得將下方網址，換成你自己在 Google Apps Script 部署得到的網頁應用程式 URL 唷！
    const API_URL = "https://google.com"; 

    const p1Text = document.getElementById('p1-text');
    const btnPool = document.getElementById('btn-pool');
    const amountInput = document.getElementById('amount-input');
    const modal = document.getElementById('success-modal');
    const playerSelect = document.getElementById('player-select');

    // 從網址獲取當前玩家參數
    const urlParams = new URLSearchParams(window.location.search);
    let currentPlayer = urlParams.get('p') || "1";
    
    // 同步下拉選單
    playerSelect.value = currentPlayer;

    // 切換玩家
    function switchPlayer(playerVal) {
        window.location.search = `?p=${playerVal}`;
    }

    // 讀取數據並轉換單位
    async function fetchFromSheet() {
        try {
            const response = await fetch(`${API_URL}?p=${currentPlayer}`);
            const data = await response.json();
            
            // 🎯 核心修改：將試算表的數值除以 1000000，並加上 M 單位
            const formattedCash = (Number(data.p_cash) / 1000000) + "M";
            
            p1Text.innerText = `${data.p_name}$： ${formattedCash}`;
            btnPool.innerText = `現金池現金：${data.pool_cash}`;
        } catch (error) {
            console.error("讀取試算表失敗:", error);
        }
    }

    // 單位轉換
    function convertUnit(multiplier) {
        let val = parseFloat(amountInput.value);
        if (!isNaN(val)) {
            amountInput.value = val * multiplier;
        }
    }

    // 與 Sheet 互動
    async function handleAction(actionType) {
        let amount = parseFloat(amountInput.value) || 0;
        try {
            p1Text.innerText = "同步中...";
            const response = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    p: currentPlayer,
                    action: actionType,
                    amount: amount
                })
            });
            const result = await response.json();
            if (result.status === "success") {
                modal.style.display = 'flex';
                amountInput.value = "";
                await fetchFromSheet();
            }
        } catch (error) {
            alert("同步失敗，請檢查網路或 API 設定。");
            await fetchFromSheet();
        }
    }

    function closeModal() {
        modal.style.display = 'none';
    }

    fetchFromSheet();
    setInterval(fetchFromSheet, 5000);
</script>

</body>
</html>
